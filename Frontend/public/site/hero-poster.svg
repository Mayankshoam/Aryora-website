<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="heroDarkLux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E281E"/>
      <stop offset="45%" stop-color="#0A1E16"/>
      <stop offset="100%" stop-color="#050F0B"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="65%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050F0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian & Royal Emerald Ambient Backdrop (No distracting line drawings) -->
  <rect width="1920" height="1080" fill="url(#heroDarkLux)"/>
  <rect width="1920" height="1080" fill="url(#ambientGlow)"/>
</svg>
